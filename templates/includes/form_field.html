{% if field.field.widget.input_type == 'checkbox' %}
    <label class="form-check {% if field.errors %}has-error{% endif %}">
        {{ field }}
        <span>
            <strong>{{ field.label }}</strong>
            {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        </span>
    </label>
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
{% else %}
    <div class="form-field {% if field.errors %}has-error{% endif %}">
        <label for="{{ field.id_for_label }}">
            {{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}<p class="field-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </div>
{% endif %}
